[syjobber.14234089916642484789]
description = "Unterwegs von Faial nach São Jorge sahen wir eine wirklich große Schule von Grindwalen … bestimmt mehr als 20 Tiere, die sehr entspannt um uns herumschwammen. Diesmal waren es wirklich Grindwale, das haben wir mit Monika von der PFADFINDER abgestimmt, denn die kennt sich aus. Auf der langen Überfahrt hatten wir auch Grindwale gesehen, dachten wir fälschlicherweise, denn es waren tatsächlich Buckelwale, wie sie uns erklärte, als sie den Blog las. Wir kamen nachmittags auf São Jorge an, der dritten von uns besuchten Azoreninsel, wo es in der Ankerbucht von Velas schon ziemlich voll war, aber wir fanden noch einen Platz und nach uns kamen noch weitere 4 Boote. Da der Hafen keinen Platz für uns hatte, machten wir das Dinghi klar und fuhren zum Anmelden. Der supernette Hafenmeister stellte uns einen Platz für den nächsten Tag in Aussicht und gab uns schonmal eine Karte für das Tor am Steg und die Sanitäranlagen. Nach einem Bier in der nahegelegenen Bar ging´s zurück und wir verbrachten, nach langer Zeit mal wieder eine Nacht vor Anker. Sobald es dunkel wurde lockte uns ein sehr seltsames Geräusch an Deck. Es klang wie: „Aua … Aua … Aua … Ahhh … Aua … Aua!“ Wie wir schon gehört hatten, waren dies Gelbschnabelsturmtaucher, die in den Felswänden um uns herum wohnten und die ganze Nacht über, wen auch immer, riefen. Das war schon sehr speziell! Am nächsten Morgen fuhr Thomas mit dem Dinghi in den Hafen und … unser Platz war schon frei … hatten wir gar nicht mitbekommen. Wir verstauten also ruck-zuck den Außenborder und das Dinghi, bauten Fender und Leinen an, gingen Anker auf und fuhren durch die knifflige, weil flache, Einfahrt, Jutta maulte: „… und wieder alles vorm Frühstück!“ Die Plätze in dem winzigen Hafen waren sehr begehrt, besonders für große Schiffe gab es nicht viele, es half also nix!"
id = "14234089916642484789"
timestamp = 1783382400
title = "Inselhopping Faial … São Jorge … Terceira"
url = "https://www.sy-jobber.de/2026/07/07/inselhopping-faial-s%C3%A3o-jorge-terceira/"

[syjobber.14748032987513837742]
description = "Wir verließen Terceira am späten Vormittag, um bei Tageslicht auf São Miguel anzukommen. Der Wetterbericht hatte guten Wind vorhergesagt, der aber leider erst einen Tag später kam, also motorten wir durch die Nacht und kamen morgens um 8.30 Uhr in der Marina von Ponta Delgada an. Die Marina, die für unangenehmen Schwell bekannt ist, war ganz schön voll und es gab noch genau zwei Plätze … einer etwas innerhalb der Marina und einer am Außensteg, wo wir nicht unbedingt hinwollten. Wir hatten von Dorians aus der WhatsApp-Überfahrt-Gruppe gehört, dass es ein paar Tage vorher bei fieser Wetterlage einige Schäden gegeben hatte … Klampen wurden aus Decks herausgerissen und ein Steg war beschädigt worden. Das bedeutete schlaflose Nächte. Wir probierten es also an dem inneren Steg, machten fest und standen pünktlich zur Öffnung am Marina Office, um zu erfahren, dass wir dort nicht würden bleiben können, denn der Platz war für ein Charterschiff reserviert. Da wir wussten, dass uns ein weiteres deutsches Schiff dicht auf den Fersen war, brachen wir den Anmeldevorgang ab und schauten uns die Box am Außensteg an. In der Nachbarbox lag ein Charterboot mit deutscher Crew, die alle Klampen am Steg belegt hatte … auch die, die wir nutzen würden. Wir baten also höflich, die Klampen freizumachen, denn wir würden in ein paar Minuten dort sein. Im Eiltempo ging`s zurück zum Boot, Leinen los und ab in die letzte noch freie Box. Das andere deutsche Boot kam uns entgegen und suchte nach einem Platz im Inneren des Hafens, wir bogen um die Ecke und ergatterten mit 2 Bootslängen Vorsprung die letzte Box. Puh, das war knapp! Die Nachbarcrew hatte die Klampen natürlich nicht freigemacht, saß seelenruhig im Cockpit und schaute zu, wie wir anlegten, GRRRHHH! Eigentlich ist es gängige Praxis, dass man Booten beim Anlegen hilft, wenn man sie kommen sieht … naja! Nun ging´s zum zweiten Anmeldeversuch ins Marina Office, zur Polizei, denn man muss sich auf jeder Insel der Azoren neu anmelden, obwohl alle zu Portugal, also Europa gehören … das muss man wohl nicht verstehen und dann zum wohlverdienten Nickerchen nach dem ganzen Stress."
id = "14748032987513837742"
timestamp = 1787097600
title = "São Miguel und „Auf nach Frankreich!“"
url = "https://www.sy-jobber.de/2026/08/19/s%C3%A3o-miguel-und-auf-nach-frankreich/"

[syjobber.5425522015325797412]
description = "Wir genossen die ruhige Nacht ohne Geschaukel im Ankerfeld vor Horta und schliefen wie die Steine. Morgens nahmen wir, weil der Wind gerade schwach war, unser beschädigtes Vorsegel runter, denn es musste bei Gelegenheit zum Segelmacher zur Reparatur. Bei genauerer Betrachtung stellte sich heraus, dass sich nur eine Naht am Achterliek gelöst hatte, die über ein Einfassband den UV-Schutz und das Segeltuch verband … also kein Schaden am Segel, nur eine lose Naht … nicht so schlimm, aber mit unserer Nähmaschine nicht zu machen. Alle Nähte, die der Sonne ausgesetzt sind, wie diese, denn sie liegt außen, wenn das Segel aufgerollt ist, geben früher oder später auf. Das hatten wir beim Bimini und dem Lazybag auch schon erlebt. Jetzt wollten wir aber auch mal an Land und machten Dinghi und Außenborder klar. Wir fuhren zum Dinghidock in die Marina und da kam der Anruf vom Harbormaster, er hätte einen Platz für uns im Hafen … großartig! Also alles wieder retour … zurück zum Boot, Außenborder verstauen, Dinghi an Deck, Fender und Festmacher anbringen, Anker auf und an die Innenseite der Betonmole, was super war, denn im Gegensatz zur Außenseite der Mole, würde es hier viel weniger Schwell geben. Wir dockten also nach dem ganzen Hin und Her an, unsere zukünftigen Nachbarn, ein dänisches Boot, wartete schon, denn sie wollten mit uns ins „Päckchen“ also an unserem Boot festmachen. In der Marina war es so voll, dass die Plätze an den Molen meistens zu dritt belegt waren, also mit „Dreier-Päckchen.“ Das klappte alles gut, jetzt hatten wir Landstrom, Wasseranschluss und konnten mit einem Schritt an Land … welch ein Luxus!"
id = "5425522015325797412"
timestamp = 1782518400
title = "Faial – die blaue Insel … Ilha Azul"
url = "https://www.sy-jobber.de/2026/06/27/faial-die-blaue-insel-ilha-azul/"

[sypicaroon.15613077328284721187]
description = "Wie bereits in 2021 ging es bei schönstem Segelwetter gegen Mittag von der Marina Rubicon auf Lanzarote los und schon nach ein paar Meilen bekamen wir Besuch von einzelnen Delfinen und einer Schule Pilotwalen. Für die ersten 3 Stunden lief der Motor unterstützend mit. Dann ging es mit Groß, Genua und Kuttersegel in die erste Nacht. Als der Wind zeitweise auf 5 bft. auffrischte habe ich sicherheitshalber ein erstes Reff ins Groß gebunden, die Genua eingerollt und die Fock nach Stb. ausgebaumt. Die Aries Windsteueranlage funktioniert nach der Reparatur in Tazacorte wieder tadellos. Leider hatte ich oftmals in Unwissenheit die Gelenke und das Pendelruder mit mineralischem WD40 Öl behandelt. Dadurch sind die Teflonbuchsen im Pendelrohr aufgequollen und alles ging nur noch sehr schwergängig. Bei leichtem Wind ist das Schiff in Folge dessen immer wieder aus dem Ruder gelaufen. Bis auf ein paar ziemlich dichte Begegnungen mit der Berufsschiffart verlief die Nacht bei leichtem Wind aus NE entspannt und ich konnte im 20 min. Intervall etwas Schlaf bekommen. Am späten Vormittag hatten wir die NE Spitze von Teneriffa querab und der Wind frischte wieder etwas auf. Das Reff im Groß hatte ich bereits früh am Morgen ausgeschüttelt, was sich im Nachhinein aber als Fehler herausstellte. Auf dem Weg zur NW Spitze baute sich eine hohe Windsee aus NE auf, die im 90 grad Winkel gegen die lange Dünung aus NW auflief. Die Folge war mal wieder eine unangenehme Kreuzsee. Nach einzelnen Boen von bis zu 38 Ktn. entschloß ich mich viel zu spät, wieder ein Reff ins Groß zu binden. Die Fock war weiterhin nach Stb. ausgebaumt. Durch die zu große Segelfläche im Groß hatte die Aries bereits Schwierigkeiten den Kurs zu halten. Also ging es angeleint aufs Vorschiff und es wurde gerefft. Als es bereits dunkel war rundeten wir die NW Spitze und nach weiteren 2 Stunden war der Wind wie angekündigt schlagartig weg. Die restliche Nacht verbrachten wir im Geschaukel unter Motor. Da wir erst gegen Mittag in den Hafen konnten haben wir noch eine Runde bis nach Vueltas gedreht ind vergeblich versucht einen Fisch fürs Abendessen zu fangen. Das Einlaufen in den Hafen von San Sebastian fühlte sich für mich wie ein Nachhausekommen an. Hier gefällt es mir immer noch am Besten und ich werde voraussichtlich wieder eine lange Zeit auf der schönen Insel verbringen."
id = "15613077328284721187"
timestamp = 1678752000
title = "Westwärts nonstop nach Gomera"
url = "https://www.sy-picaroon.de/2023/03/14/westw%C3%A4rts-nonstop-nach-gomera/"

[sypicaroon.16743432544381412501]
description = "Von Pasito Blanco nach Morro Jable Gegen Mittag sind wir wir zuerst nach Norden an der Küste hochgefahren um einen besseren Windwinkel nach Fuerteventura zu bekommen. Da wir noch bei Tageslicht auf dem Ankerplatz unterhalb der Kirche von Morro Jable eintreffen wollten, planten wir einen Ankerstopp in der Bahia de Arinaga. Hier liegt man hinter einer großen Industriemole sehr geschützt gegen den Atlantikschwell aber nicht frei von starker Geruchsbelästigung durch ein naheliegendes Klärwerk. Martina und Jens von der Maje hatten die gleiche Idee und so konnten wir die morgige Überfahrt gemeinsam angehen. Am nächsten Morgen ging es sehr früh Ankerauf und erstmal Kurs NE um weitere Höhe gutzumachen. Dann im rechten Winkel durch das Verkehrstrennungsgebiet und wieder etwas angeluft auf direkten Kurs zur Südspitze von Fuerteventura. Da ich auf die starken Fallwinde durch meine letzte Ansteuerung vorgewarnt war, fiel das Großsegel bereits als der Leuchturm querab lag. Der Motor meldete jedoch nach kurzer Laufzeit eine Überhitzung und wurde sofort abgeschaltet. Das Schiff wurde mit gereffter Genua und Autopilot auf Kurs gehalten und ich begab mich unter Deck, um die Ursache zu ergründen. Den Impeller der Wasserpumpe hatte ich vor 2 Jahren gewechselt und vor der Abfahrt auf La Palma nochmal kontrolliert. Nun hatte sich eine Flunke gelöst und in der Saugleitung festgesetzt. Natürlich pünktlich mitten in den schönsten Fallwinden. Die Instandsetzung nahm dann gefühlte 2 Stunden in Anspruch und wir kamen mit dem letzten Tageslicht am Ankerplatz an. Die folgenden Ankertage verbrachten wir mir langen Strandwanderungen und genossen die erstklassigen Fischgerichte der örtlichen Gastronomie. Einzig die immer stärker werdende Dünung und die akrobatischen Einlagen beim Anlanden und Ablegen mit dem Dingy verhinderten eine längere Aufenthaltsdauer. Nun lockt uns die Marina Rubicon auf Lanzarote, wo ein längerer Aufenthalt geplant ist."
id = "16743432544381412501"
timestamp = 1678320000
title = "Von Pasito Blanco nach Morro Jable"
url = "https://www.sy-picaroon.de/2023/03/09/von-pasito-blanco-nach-morro-jable/"

[sypicaroon.5780778972941526711]
description = "Während ich diese Zeilen schreibe befinde ich mich auf hoher See in Richtung Madeira mit dem Ziel Porto Santo, der kleinen Nachbarinsel im Nordosten des Archipels. Nach nunmehr 3 Jahren auf den Kanaren ist ein Tapetenwechsel überfällig gewesen. Mit etwas Wehmut habe ich in San Sebastian auf La Gomera die Leinen gelöst und mich nach einem kurzen Stopp auf La Palma auf den Weg gemacht. So langsam wachsen auch die Seebeine wieder, die die letzten Monate etwas zu kurz gekommen sind. Das anfängliche Übelsein ist nun wieder der Freude am Segeln gewichen. Auch an den Wach-u. Schlafrythmus des Einhandseglers habe ich mich schnell wieder gewöhnt. Einzig die Bedenken bezüglich der Orca Attacken an der Portugiesischen Küste sind noch im Kopf und verursachen ein Unbehagen hinsichtlich der weiteren Etappe der Überfahrt zum Festland. Der aktuelle Plan lautet, auf Porto Santo auf ein sicheres Wetterfenster zur Weiterfahrt an die Algarve zu warten. Dort soll die Picaroon für den Sommer an Land gestellt werden. Im Herbst geht es dann weiter in Richtung Andalusien und vielleicht auch ins Mittelmeer."
id = "5780778972941526711"
timestamp = 1710633600
title = "Abschied von den Kanaren"
url = "https://www.sy-picaroon.de/2024/03/17/abschied-von-den-kanaren/"

